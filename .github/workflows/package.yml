# Builds the chatty-cli wheel on every v* tag and attaches it to a GitHub
# Release. Inert until the tag is pushed (the tag must contain this file).
name: package

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - uses: softprops/action-gh-release@v2
        with:
          files: "dist/*"
          generate_release_notes: true