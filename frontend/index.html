<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>chatty</title>
    <meta name="color-scheme" content="dark light" />
    <script>
      // Resolve the theme before first paint so there is no flash. Mirrors
      // src/theme.ts: an explicit light/dark preference wins, otherwise the OS.
      (function () {
        var t = "dark";
        try {
          var p = localStorage.getItem("chat.theme");
          t =
            p === "light" || p === "dark"
              ? p
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
        } catch (e) {
          /* storage or matchMedia unavailable — keep the dark fallback */
        }
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
